TestCases:
- name: allow microflow using constants and variables
  allow: true
  input:
    Name: ACT_CallApi
    ObjectCollection:
      Objects:
        - $Type: Microflows$ActionActivity
          Action:
            $Type: Microflows$RestCallAction
            HttpConfiguration:
              $Type: Microflows$HttpConfiguration
              UseHttpAuthentication: true
              HttpAuthenticationPassword: $Constants/ApiPassword
              HttpHeaderEntries:
                - $Type: Microflows$HttpHeaderEntry
                  Key: Authorization
                  Value: "'Bearer ' + $Token/Value"
- name: allow documentation mentioning a password
  allow: true
  input:
    Name: ACT_Documented
    ObjectCollection:
      Objects:
        - $Type: Microflows$ActionActivity
          Documentation: "Example: password=changeme123"
          Caption: "password=changeme123"
- name: allow placeholder in message template
  allow: true
  input:
    Name: ACT_Message
    ObjectCollection:
      Objects:
        - $Type: Microflows$ActionActivity
          Action:
            $Type: Microflows$ShowMessageAction
            Template:
              Text:
                Items:
                  - Text: "Reset with password={1}"
- name: do not allow credential assignment in expression
  allow: false
  input:
    Name: ACT_Connect
    ObjectCollection:
      Objects:
        - $Type: Microflows$ActionActivity
          Action:
            $Type: Microflows$CreateVariableAction
            InitialValue: "'jdbc:db://host/db?user=app&password=SuperSecret1'"
- name: do not allow credentials in url
  allow: false
  input:
    Name: ACT_Connect
    ObjectCollection:
      Objects:
        - $Type: Microflows$ActionActivity
          Action:
            $Type: Microflows$CreateVariableAction
            InitialValue: "'https://admin:SuperSecret1@example.com/api'"
- name: do not allow hard-coded authorization header
  allow: false
  input:
    Name: ACT_CallApi
    ObjectCollection:
      Objects:
        - $Type: Microflows$ActionActivity
          Action:
            $Type: Microflows$RestCallAction
            HttpConfiguration:
              $Type: Microflows$HttpConfiguration
              HttpHeaderEntries:
                - $Type: Microflows$HttpHeaderEntry
                  Key: x-api-key
                  Value: "'abcd1234efgh5678'"
- name: do not allow hard-coded http authentication password
  allow: false
  input:
    Name: ACT_CallApi
    ObjectCollection:
      Objects:
        - $Type: Microflows$ActionActivity
          Action:
            $Type: Microflows$RestCallAction
            HttpConfiguration:
              $Type: Microflows$HttpConfiguration
              UseHttpAuthentication: true
              HttpAuthenticationPassword: "'SuperSecret1'"
- name: do not allow hard-coded password attribute
  allow: false
  input:
    Name: ACT_CreateUser
    ObjectCollection:
      Objects:
        - $Type: Microflows$ActionActivity
          Action:
            $Type: Microflows$CreateChangeAction
            Items:
              - $Type: Microflows$ChangeActionItem
                Attribute: MyFirstModule.Account.Password
                Value: "'Welcome123'"
