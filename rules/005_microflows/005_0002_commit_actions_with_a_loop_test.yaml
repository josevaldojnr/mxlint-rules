TestCases:
- name: allow commit outside loop
  allow: true
  input:
    Name: ACT_CommitAfterLoop
    ObjectCollection:
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$ChangeAction
                  Commit: "No"
        - $Type: Microflows$ActionActivity
          Action:
            $Type: Microflows$CommitAction
- name: do not allow commit action in loop
  allow: false
  input:
    Name: ACT_CommitInLoop
    ObjectCollection:
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$CommitAction
- name: do not allow change with commit in loop
  allow: false
  input:
    Name: ACT_ChangeInLoop
    ObjectCollection:
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$ChangeAction
                  Commit: "Yes"
- name: do not allow create with commit in loop
  allow: false
  input:
    Name: ACT_CreateInLoop
    ObjectCollection:
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$CreateChangeAction
                  Commit: YesWithoutEvents
