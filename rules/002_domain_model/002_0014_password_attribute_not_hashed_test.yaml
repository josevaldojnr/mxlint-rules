TestCases:
- name: allow hashed password attribute
  allow: true
  input:
    Entities:
      - Name: Account
        MaybeGeneralization:
          Persistable: true
        Attributes:
          - Name: Password
            NewType:
              $Type: DomainModels$HashedStringAttributeType
            Value:
              $Type: DomainModels$StoredValue
- name: allow plain string password on non-persistent entity
  allow: true
  input:
    Entities:
      - Name: PasswordForm
        MaybeGeneralization:
          Persistable: false
        Attributes:
          - Name: NewPassword
            NewType:
              $Type: DomainModels$StringAttributeType
              Length: 200
            Value:
              $Type: DomainModels$StoredValue
- name: allow unrelated string attribute
  allow: true
  input:
    Entities:
      - Name: Account
        MaybeGeneralization:
          Persistable: true
        Attributes:
          - Name: Email
            NewType:
              $Type: DomainModels$StringAttributeType
              Length: 200
            Value:
              $Type: DomainModels$StoredValue
- name: allow no entities
  allow: true
  input:
    Entities: null
- name: do not allow plain string password on persistent entity
  allow: false
  input:
    Entities:
      - Name: Account
        MaybeGeneralization:
          Persistable: true
        Attributes:
          - Name: UserPassword
            NewType:
              $Type: DomainModels$StringAttributeType
              Length: 200
            Value:
              $Type: DomainModels$StoredValue
