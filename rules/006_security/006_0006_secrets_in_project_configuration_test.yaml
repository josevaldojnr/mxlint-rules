TestCases:
- name: allow non-sensitive constant value
  allow: true
  input:
    Settings:
      - $Type: Settings$ConfigurationSettings
        Configurations:
          - $Type: Settings$ServerConfiguration
            ConstantValues:
              - $Type: Settings$ConstantValue
                ConstantId: DTAP.DTAPMode
                SharedOrPrivateValue:
                  $Type: Settings$SharedValue
                  Value: Development
- name: allow sensitive constant with empty value
  allow: true
  input:
    Settings:
      - $Type: Settings$ConfigurationSettings
        Configurations:
          - $Type: Settings$ServerConfiguration
            ConstantValues:
              - $Type: Settings$ConstantValue
                ConstantId: Encryption.EncryptionKey
                SharedOrPrivateValue:
                  $Type: Settings$SharedValue
                  Value: ""
- name: allow sensitive constant with private value
  allow: true
  input:
    Settings:
      - $Type: Settings$ConfigurationSettings
        Configurations:
          - $Type: Settings$ServerConfiguration
            ConstantValues:
              - $Type: Settings$ConstantValue
                ConstantId: Encryption.EncryptionKey
                SharedOrPrivateValue:
                  $Type: Settings$PrivateValue
                  Value: secret-value
- name: allow settings without configurations
  allow: true
  input:
    Settings: []
- name: do not allow sensitive constant with shared value
  allow: false
  input:
    Settings:
      - $Type: Settings$ConfigurationSettings
        Configurations:
          - $Type: Settings$ServerConfiguration
            ConstantValues:
              - $Type: Settings$ConstantValue
                ConstantId: Encryption.EncryptionKey
                SharedOrPrivateValue:
                  $Type: Settings$SharedValue
                  Value: 0123456789abcdef0123456789abcdef
