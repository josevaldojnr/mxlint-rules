TestCases:
- name: allow strong admin password
  allow: true
  input:
    AdminPassword: "Str0ng!Passw0rd#2026"
    PasswordPolicySettings:
      MinimumLength: 12
      RequireDigit: true
      RequireMixedCase: true
      RequireSymbol: true
- name: allow blank password handled by another rule
  allow: true
  input:
    AdminPassword: ""
    PasswordPolicySettings:
      MinimumLength: 12
- name: allow eight character password without a policy
  allow: true
  input:
    AdminPassword: "abcdefgh"
- name: do not allow short password
  allow: false
  input:
    AdminPassword: "1"
    PasswordPolicySettings:
      MinimumLength: 12
- name: do not allow password shorter than eight without a policy
  allow: false
  input:
    AdminPassword: "abc123"
- name: do not allow password shorter than the policy minimum
  allow: false
  input:
    AdminPassword: "Abcdef1!"
    PasswordPolicySettings:
      MinimumLength: 12
- name: do not allow password without digit when required
  allow: false
  input:
    AdminPassword: "Abcdefgh!ijkl"
    PasswordPolicySettings:
      MinimumLength: 12
      RequireDigit: true
- name: do not allow password without mixed case when required
  allow: false
  input:
    AdminPassword: "abcdefgh1!ijkl"
    PasswordPolicySettings:
      MinimumLength: 12
      RequireMixedCase: true
- name: do not allow password without symbol when required
  allow: false
  input:
    AdminPassword: "Abcdefgh1ijkl"
    PasswordPolicySettings:
      MinimumLength: 12
      RequireSymbol: true
